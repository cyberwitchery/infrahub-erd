"""
InfraDevice is the only concrete node that stands alone. CoreGroup is reached
from it, CoreNode only through CoreGroup, and CoreUnreferenced not at all.
CoreRepository implements the CoreGenericRepository generic InfraDevice points
at.
"""
type Query {
  InfraDevice(name: String): InfraDevice
}

interface AttributeInterface {
  is_default: Boolean
}

interface CoreNode {
  id: String!
  hfid: [String!]
  display_label: String
  member_of_groups: NestedPaginatedCoreGroup
}

interface CoreGroup {
  id: String!
  display_label: String
  name: TextAttribute
  group_type: TextAttribute
  members: NestedPaginatedCoreNode
  parent: NestedEdgedCoreGroup
}

interface CoreUnreferenced {
  id: String!
  label: TextAttribute
}

interface CoreGenericRepository {
  id: String!
  display_label: String
  location: TextAttribute
}

type InfraDevice implements CoreNode {
  id: String!
  display_label: String
  name: TextAttribute
  primary_group: NestedEdgedCoreGroup
  repository: NestedEdgedCoreGenericRepository
  member_of_groups: NestedPaginatedCoreGroup
  subscriber_of_groups: NestedPaginatedCoreGroup
  profiles: NestedPaginatedCoreNode
}

type CoreRepository implements CoreNode & CoreGenericRepository & CoreUnreferenced {
  id: String!
  display_label: String
  location: TextAttribute
}

type TextAttribute implements AttributeInterface {
  value: String
  is_default: Boolean
}

type NestedEdgedCoreGroup {
  node: CoreGroup
}

type NestedEdgedCoreGenericRepository {
  node: CoreGenericRepository
}

type NestedPaginatedCoreGroup {
  edges: [EdgedCoreGroup]
  count: Int
}

type EdgedCoreGroup {
  node: CoreGroup
}

type NestedPaginatedCoreNode {
  edges: [EdgedCoreNode]
  count: Int
}

type EdgedCoreNode {
  node: CoreNode
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}
